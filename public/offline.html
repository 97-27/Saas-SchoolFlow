<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#059669" />
  <title>School Flow Africa — Hors connexion</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { width: 100%; max-width: 420px; background: #fff; border: 1px solid #e2e8f0; border-radius: 28px; padding: 32px 28px; text-align: center; box-shadow: 0 10px 40px rgba(15, 23, 42, .06); }
    .logo { width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 24px; background: linear-gradient(135deg, #059669, #047857 60%, #0f172a); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(5, 150, 105, .35); }
    .logo svg { width: 60px; height: 60px; }
    .brand { font-weight: 900; font-size: 22px; letter-spacing: -.02em; }
    .brand b { color: #059669; }
    .dot { display: inline-block; width: 6px; height: 6px; background: #fbbf24; border-radius: 50%; margin-left: 3px; vertical-align: top; animation: pulse 1.6s infinite; }
    h1 { font-size: 18px; margin: 18px 0 6px; font-weight: 800; }
    p { margin: 0; font-size: 13px; color: #64748b; line-height: 1.55; }
    .pill { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; padding: 8px 14px; border-radius: 999px; background: #fffbeb; border: 1px solid #fde68a; color: #92400e; font-size: 12px; font-weight: 700; }
    .pill i { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; animation: pulse 1.2s infinite; }
    button { margin-top: 22px; width: 100%; padding: 13px 16px; border: 0; border-radius: 14px; background: linear-gradient(90deg, #059669, #10b981); color: #fff; font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: 0 8px 20px rgba(5, 150, 105, .3); }
    button:active { transform: scale(.99); }
    .hint { margin-top: 14px; font-size: 11px; color: #94a3b8; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 18 L86 33 L50 48 L14 33 Z" fill="#fbbf24" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M50 48 C42 42 26 44 18 50 L18 76 C26 70 42 68 50 74 Z" fill="#fff" opacity=".95"/>
        <path d="M50 48 C58 42 74 44 82 50 L82 76 C74 70 58 68 50 74 Z" fill="#fff"/>
        <path d="M50 48 L50 82" stroke="#047857" stroke-width="4" stroke-linecap="round"/>
        <path d="M24 64 C34 58 42 62 50 67 C58 72 66 68 76 62" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="brand">School<b>Flow</b> Africa<span class="dot"></span></div>
    <h1>Pas de connexion Internet</h1>
    <p>Votre appareil n’est pas relié à Internet pour le moment. SchoolFlow reviendra tout seul dès que la connexion sera rétablie.</p>
    <div class="pill"><i></i> En attente du réseau…</div>
    <button onclick="location.reload()">Réessayer maintenant</button>
    <div class="hint">Vérifiez les données mobiles ou le Wi-Fi, puis réessayez.</div>
  </div>
  <script>
    window.addEventListener('online', function () { setTimeout(function () { location.reload(); }, 600); });
  </script>
</body>
</html>
